name: Snap (tag)

# Builds the snap for one upstream tag, on request, and uploads it as a
# workflow artifact. Nothing is pushed and nothing is published to the store.
#
# The packaging commits from the branch the workflow is started from (normally
# snap) are replayed on top of the tag, the same way snap.yml builds beta. The
# tag does not have to be on main: tags on release/* branches work as well.
#
# Run it from the Actions tab or with:
#   gh workflow run snap-tag.yml --ref snap -f tag=v2.3.1
#
# workflow_dispatch workflows can only be started once this file is on the
# repository's default branch (snap).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (e.g. v2.3.1)
        required: true
        type: string
      version:
        description: Snap version (default taken from the tag's version.inc)
        required: false
        type: string
      retention-days:
        description: Days to keep the artifact
        required: false
        type: number
        default: 14

concurrency:
  group: snap-tag-${{ inputs.tag }}
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/OrcaSlicer/OrcaSlicer.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ inputs.tag }} (amd64)
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put the packaging commits on top of the tag
        id: prepare
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          # Inputs are read from env instead of being expanded into the script,
          # so they can never become shell code
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid tag name: $TAG"
            exit 1
          fi
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9.+~-]*$ ]]; then
            echo "::error::Invalid snap version: $VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          if ! git fetch --force --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"; then
            echo "::error::Tag $TAG not found in $UPSTREAM"
            exit 1
          fi

          # Commits on this branch that are not upstream = the packaging commits
          packaging=$(git rev-list --count "upstream/$UPSTREAM_BRANCH..HEAD")
          if [ "$packaging" -eq 0 ]; then
            echo "::error::No packaging commits on ${GITHUB_REF_NAME} on top of upstream/$UPSTREAM_BRANCH"
            exit 1
          fi
          echo "Replaying $packaging packaging commit(s) from ${GITHUB_REF_NAME} onto $TAG:"
          git log --oneline "upstream/$UPSTREAM_BRANCH..HEAD"
          git rebase --onto "$TAG" "upstream/$UPSTREAM_BRANCH"

          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^set(SoftFever_VERSION "\(.*\)")/\1/p' version.inc)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot read SoftFever_VERSION from version.inc at $TAG; pass a version"
            exit 1
          fi
          mkdir -p snap/local
          echo "$VERSION" > snap/local/version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG as snap version $VERSION"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: snapcore/action-build@v1
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: orca-slicer_${{ steps.prepare.outputs.version }}_amd64
          path: ${{ steps.build.outputs.snap }}
          # A .snap is already compressed
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          {
            echo "### OrcaSlicer $VERSION ($TAG)"
            echo
            echo "The snap is available as an artifact of this run (\`$(basename "$SNAP_FILE")\`)."
            echo "Download and install it with:"
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY"
            echo "sudo snap install --dangerous $(basename "$SNAP_FILE")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
